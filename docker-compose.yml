services:
  arduino-controller:
    build: .
    container_name: pi-arduino-controller
    # 自動重啟設定：即使當機、Ctrl+C、或者 Pi 重開機，都會自動重啟 Flask
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-5000}:5000"

    # 關鍵：將實體的 Arduino USB 映射進容器。
    # 用 SERIAL_PORT 同時決定「映射哪個裝置」和「程式開哪個埠」，
    # 避免只改到一邊（ttyUSB0 / ttyACM0 的差異只需在 .env 改一次）。
    devices:
      - "${SERIAL_PORT:-/dev/ttyUSB0}:${SERIAL_PORT:-/dev/ttyUSB0}"

    # 每台 Pi 的專屬設定放在 .env（見 .env.example），不進版控，
    # 所以這個檔案在每台 Pi 上都一模一樣，git pull 不會衝突。
    environment:
      - PI_ID=${PI_ID:-pi-001}
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyUSB0}
      - BAUD_RATE=${BAUD_RATE:-115200}
